# =============================================================================
# LLARS GitLab CI/CD Pipeline
# =============================================================================
# Blue-Green deployment with nightly schedule:
#
# Push (any time):
#   lint → unit tests → integration tests → security → build
#
# Nightly Schedule 02:00 CET (or FORCE_DEPLOY):
#   deploy:staging (Port 55080)
#     → wait:staging-health
#     → test:e2e:nightly:tiles (Tile + Workflow Playwright suite)
#     → smoke:staging (Evaluation + Prompt Eng pipeline)
#     → deploy:production
#     → smoke:production
#     → [FAIL] → rollback:production (auto)
#
# Stages:
#   1. lint           - Code quality
#   2. test           - Unit & Integration tests
#   3. security       - Route protection & dependency audit
#   4. build          - Docker images
#   5. deploy-staging - Blue-Green staging deployment
#   6. test-staging   - Nightly E2E & Smoke tests against staging
#   7. deploy         - Production deployment
#   8. smoke          - Production smoke tests
#   9. rollback       - Emergency rollback
#
# Prerequisites (GitLab CI/CD Variables):
#   - SSH_PRIVATE_KEY: Private Key for SSH access
#   - SSH_KNOWN_HOSTS: Known Hosts entry
#   - LLARS_SERVER_HOST: Hostname/IP of LLARS server
#   - LLARS_SERVER_USER: SSH username (default: master)
#   - LLARS_DEPLOY_PATH: Path to LLARS project on server
#   - SYSTEM_ADMIN_API_KEY: API key for smoke tests
#   - E2E_TEST_PASSWORD: Password for E2E test users
#   - (optional) E2E_ADMIN_USER / E2E_RESEARCHER_USER / E2E_EVALUATOR_USER
#     Defaults in nightly job: test_admin / test_researcher / test_evaluator
#
# GitLab Pipeline Schedule (create in UI):
#   Name: "Nightly Production Deployment"
#   Cron: 0 2 * * 1-5 (Mon-Fri 02:00 CET)
#   Branch: main
#   Variable: SCHEDULED_DEPLOY=true
# =============================================================================

stages:
  - lint
  - test
  - security
  - build
  - deploy-staging
  - test-staging
  - deploy
  - smoke
  - rollback

# =============================================================================
# GLOBAL CONFIGURATION
# =============================================================================

# Optional test-only switches (set one to run only that job)
# - UNIT_BACKEND_ONLY
# - UNIT_FRONTEND_ONLY
# - INTEGRATION_ONLY

variables:
  # Python
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"

  # Node.js
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"

  # Docker
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_IMAGE_TAG: $CI_COMMIT_SHORT_SHA

  # Deployment (Server: 141.75.150.128)
  LLARS_SERVER_USER: "master"
  LLARS_DEPLOY_PATH: "/var/llars"

# Cache for faster builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - .cache/npm

# Standard before_script for SSH setup (Alpine Linux)
.ssh_setup: &ssh_setup
  before_script:
    - 'command -v ssh-agent >/dev/null || apk add --no-cache openssh-client'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

# Shared rule to skip non-test jobs when a test-only switch is set
.test_only_skip: &test_only_skip
  if: '$UNIT_BACKEND_ONLY || $UNIT_FRONTEND_ONLY || $INTEGRATION_ONLY'
  when: never

# Common rules for CI jobs (lint, test, security)
# Only run on: schedule, FORCE_DEPLOY, merge requests (no auto-trigger on push)
.ci_rules:
  rules:
    - *test_only_skip
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DEPLOY == "true"
    - if: $FORCE_DEPLOY == "true" && $CI_COMMIT_BRANCH == "main"

# Deployment trigger rules: schedule, force, or manual
.deploy_rules:
  rules:
    - *test_only_skip
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DEPLOY == "true"
    - if: $FORCE_DEPLOY == "true" && $CI_COMMIT_BRANCH == "main"

# =============================================================================
# STAGE 1: LINT
# =============================================================================

lint:backend:
  stage: lint
  image: python:3.11-slim
  extends:
    - .ci_rules
  script:
    - pip install flake8 black isort
    - echo "Checking Python code style..."
    - flake8 app/
    - black --check app/ --line-length=120 || true
    - isort --check-only app/ || true

lint:frontend:
  stage: lint
  image: node:20-alpine
  extends:
    - .ci_rules
  script:
    - cd llars-frontend
    - npm ci --prefer-offline
    - echo "Checking Frontend code style..."
    - |
      if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.lint ? 0 : 1)"; then
        npm run lint
      else
        echo "No frontend lint script configured; skipping frontend lint."
      fi

# =============================================================================
# STAGE 2: TEST
# =============================================================================

test:unit:backend:
  stage: test
  image: python:3.11-slim
  services:
    - name: mariadb:11.2
      alias: test-db
      variables:
        MYSQL_ROOT_PASSWORD: test
        MYSQL_DATABASE: llars_test
        MYSQL_USER: test
        MYSQL_PASSWORD: test
  variables:
    DATABASE_URL: "mysql://test:test@test-db:3306/llars_test"
    TESTING: "true"
    AUTHENTIK_DISABLED: "true"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential libffi-dev libssl-dev pkg-config
    - pip install --upgrade pip
  script:
    # Use lightweight test requirements (excludes torch/flair/transformers ~3GB)
    - pip install -r app/requirements-test.txt
    - echo "Running Backend Unit Tests..."
    - pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term-missing
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
  rules:
    - if: '$UNIT_BACKEND_ONLY'
    - if: '$UNIT_FRONTEND_ONLY || $INTEGRATION_ONLY'
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DEPLOY == "true"
    - if: $FORCE_DEPLOY == "true" && $CI_COMMIT_BRANCH == "main"

test:unit:frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd llars-frontend
    - npm ci --prefer-offline
    - echo "Running Frontend Unit Tests..."
    - npm run test:run -- --coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: llars-frontend/coverage/cobertura-coverage.xml
    expire_in: 1 week
  rules:
    - if: '$UNIT_FRONTEND_ONLY'
    - if: '$UNIT_BACKEND_ONLY || $INTEGRATION_ONLY'
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DEPLOY == "true"
    - if: $FORCE_DEPLOY == "true" && $CI_COMMIT_BRANCH == "main"

test:integration:
  stage: test
  image: python:3.11-slim
  services:
    - name: mariadb:11.2
      alias: test-db
      variables:
        MYSQL_ROOT_PASSWORD: test
        MYSQL_DATABASE: llars_test
        MYSQL_USER: test
        MYSQL_PASSWORD: test
    - name: redis:7-alpine
      alias: test-redis
  variables:
    DATABASE_URL: "mysql://test:test@test-db:3306/llars_test"
    REDIS_URL: "redis://test-redis:6379"
    TESTING: "true"
    AUTHENTIK_DISABLED: "true"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential libffi-dev libssl-dev pkg-config
    - pip install --upgrade pip
  script:
    # Use lightweight test requirements (excludes torch/flair/transformers ~3GB)
    - pip install -r app/requirements-test.txt
    - echo "Running Integration Tests..."
    - pytest tests/integration/ -v
  rules:
    - if: '$INTEGRATION_ONLY'
    - if: '$UNIT_BACKEND_ONLY || $UNIT_FRONTEND_ONLY'
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DEPLOY == "true"
    - if: $FORCE_DEPLOY == "true" && $CI_COMMIT_BRANCH == "main"
  needs:
    - job: test:unit:backend
      optional: true

test:nightly:contracts:
  stage: test
  image: python:3.11-slim
  extends:
    - .ci_rules
  script:
    - python3 scripts/testing/validate_nightly_coverage.py

# =============================================================================
# STAGE 3: SECURITY
# =============================================================================

security:routes:
  stage: security
  image: python:3.11-slim
  extends:
    - .ci_rules
  script:
    - pip install pytest
    - pytest tests/security/test_route_security.py -q --confcutdir=tests/security

# Security Scan (informational - doesn't block pipeline)
security:scan:
  stage: security
  image: python:3.11-slim
  extends:
    - .ci_rules
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends nodejs npm
  script:
    - pip install pip-audit safety
    - echo "Running security scan..."
    - pip-audit -r app/requirements.txt || echo "pip-audit found vulnerabilities"
    - cd llars-frontend && npm audit --audit-level=high || echo "npm audit found vulnerabilities"
  allow_failure: true

# =============================================================================
# STAGE 4: BUILD
# =============================================================================

build:docker:
  stage: build
  tags:
    - shell
  script:
    - echo "Building Docker images..."
    - docker compose build --parallel
    - echo "Build completed successfully"
  rules:
    - *test_only_skip
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DEPLOY == "true"
    - if: $FORCE_DEPLOY == "true" && $CI_COMMIT_BRANCH == "main"

# =============================================================================
# STAGE 5: DEPLOY STAGING (Blue-Green)
# =============================================================================

deploy:staging:
  stage: deploy-staging
  tags:
    - shell
  timeout: 15 minutes
  environment:
    name: staging
    url: http://141.75.150.128:55080
  resource_group: staging
  script:
    - echo "=== LLARS Blue-Green Staging Deployment ==="
    - echo "Timestamp:" $(date)
    - bash scripts/ci/deploy_bluegreen.sh deploy
  extends:
    - .deploy_rules

# =============================================================================
# STAGE 6: TEST STAGING (E2E + Smoke in Container)
# =============================================================================

# E2E Tests against staging (Nightly tile + workflow suite in smoke-test container)
test:e2e:nightly:tiles:
  stage: test-staging
  tags:
    - shell
  timeout: 45 minutes
  variables:
    E2E_RUN_TAG: "Nightly Test"
    E2E_ADMIN_USER: "test_admin"
    E2E_RESEARCHER_USER: "test_researcher"
    E2E_EVALUATOR_USER: "test_evaluator"
    E2E_CHATBOT_MANAGER_USER: "test_chatbot_manager"
    E2E_BOOTSTRAP_ADMIN_USER: "admin"
    E2E_BOOTSTRAP_TEST_USERS: "true"
    E2E_KEEP_TEST_USERS: "false"
  script:
    - cd /var/llars
    - mkdir -p "$CI_PROJECT_DIR/e2e-artifacts"
    # Load server .env for passwords
    - export E2E_TEST_PASSWORD=$(grep '^LLARS_ADMIN_PASSWORD=' .env | cut -d= -f2- || echo "admin123")
    - export E2E_BOOTSTRAP_ADMIN_PASSWORD="${E2E_BOOTSTRAP_ADMIN_PASSWORD:-$E2E_TEST_PASSWORD}"
    - export SYSTEM_ADMIN_API_KEY=$(grep '^SYSTEM_ADMIN_API_KEY=' .env | cut -d= -f2-)
    - bash scripts/ci/log_ci_event.sh "ci_cd.nightly.e2e.start" "Nightly E2E tile/workflow suite started"
    - 'echo "Nightly E2E tag: ${E2E_RUN_TAG}"'
    - 'echo "Nightly users: admin=${E2E_ADMIN_USER}, researcher=${E2E_RESEARCHER_USER}, evaluator=${E2E_EVALUATOR_USER}, chatbot_manager=${E2E_CHATBOT_MANAGER_USER}"'
    - 'echo "Bootstrap admin: ${E2E_BOOTSTRAP_ADMIN_USER}"'
    # Build smoke-test container (with Playwright + E2E tests)
    - docker compose --profile testing build smoke-test-service
    # Validate tile/workflow contracts before UI execution
    - python3 scripts/testing/validate_nightly_coverage.py
    # Run E2E tests against staging (localhost:55080)
    - |
      set -o pipefail
      docker compose --profile testing run --rm --entrypoint "" \
        -e PLAYWRIGHT_BASE_URL=http://localhost:55080 \
        -e E2E_TEST_PASSWORD="${E2E_TEST_PASSWORD}" \
        -e SYSTEM_ADMIN_API_KEY="${SYSTEM_ADMIN_API_KEY}" \
        -e E2E_RUN_TAG="${E2E_RUN_TAG}" \
        -e E2E_ADMIN_USER="${E2E_ADMIN_USER}" \
        -e E2E_RESEARCHER_USER="${E2E_RESEARCHER_USER}" \
        -e E2E_EVALUATOR_USER="${E2E_EVALUATOR_USER}" \
        -e E2E_CHATBOT_MANAGER_USER="${E2E_CHATBOT_MANAGER_USER}" \
        -e E2E_BOOTSTRAP_ADMIN_USER="${E2E_BOOTSTRAP_ADMIN_USER}" \
        -e E2E_BOOTSTRAP_ADMIN_PASSWORD="${E2E_BOOTSTRAP_ADMIN_PASSWORD}" \
        -e E2E_BOOTSTRAP_TEST_USERS="${E2E_BOOTSTRAP_TEST_USERS}" \
        -e E2E_KEEP_TEST_USERS="${E2E_KEEP_TEST_USERS}" \
        -e NODE_TLS_REJECT_UNAUTHORIZED=0 \
        smoke-test-service \
        bash -c "cd /tests/e2e && npx playwright test --project=chromium --workers=1 nightly/tile-regression.spec.js nightly/workflows.spec.js" \
        2>&1 | tee "$CI_PROJECT_DIR/e2e-artifacts/playwright.log"
  after_script:
    - |
      export PLAYWRIGHT_BASE_URL="http://localhost:55080"
      export E2E_TEST_PASSWORD=$(grep '^LLARS_ADMIN_PASSWORD=' /var/llars/.env | cut -d= -f2- || echo "admin123")
      export E2E_BOOTSTRAP_ADMIN_PASSWORD="${E2E_BOOTSTRAP_ADMIN_PASSWORD:-$E2E_TEST_PASSWORD}"
      python3 scripts/testing/cleanup_nightly_test_users.py || true
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        bash scripts/ci/log_ci_event.sh "ci_cd.nightly.e2e.success" "Nightly E2E tile/workflow suite passed"
      else
        bash scripts/ci/log_ci_event.sh "ci_cd.nightly.e2e.failed" "Nightly E2E tile/workflow suite failed" "error"
      fi
  artifacts:
    when: always
    paths:
      - e2e-artifacts/
    expire_in: 1 week
  extends:
    - .deploy_rules
  needs:
    - deploy:staging
    - test:nightly:contracts

# Smoke Tests against staging (Evaluation + Prompt Engineering pipeline)
smoke:staging:
  stage: test-staging
  tags:
    - shell
  timeout: 10 minutes
  script:
    - cd /var/llars
    # Load SYSTEM_ADMIN_API_KEY from server .env
    - export SYSTEM_ADMIN_API_KEY=$(grep '^SYSTEM_ADMIN_API_KEY=' .env | cut -d= -f2-)
    # Ensure smoke container reflects the current commit
    - docker compose --profile testing build smoke-test-service
    - |
      docker compose --profile testing run --rm --entrypoint "" \
        -e BASE_URL=http://localhost:55080 \
        -e SYSTEM_ADMIN_API_KEY="${SYSTEM_ADMIN_API_KEY}" \
        smoke-test-service \
        bash /tests/smoke/smoke_test.sh
  extends:
    - .deploy_rules
  needs:
    - deploy:staging
    - test:e2e:nightly:tiles

# =============================================================================
# STAGE 7: DEPLOY PRODUCTION
# =============================================================================

deploy:production:
  stage: deploy
  tags:
    - shell
  timeout: 5 minutes
  environment:
    name: production
    url: http://141.75.150.128
  resource_group: production
  script:
    - echo "=========================================="
    - echo "=== LLARS PRODUCTION SWITCH ============="
    - echo "=========================================="
    - echo "Timestamp:" $(date)
    - echo "Server:" $(hostname)
    - bash scripts/ci/deploy_bluegreen.sh switch
  extends:
    - .deploy_rules
  needs:
    - test:e2e:nightly:tiles
    - smoke:staging

# =============================================================================
# STAGE 8: SMOKE (Production)
# =============================================================================

smoke:production:
  stage: smoke
  tags:
    - shell
  timeout: 10 minutes
  environment:
    name: production
  resource_group: production
  script:
    - echo "Running production smoke tests..."
    - bash scripts/ci/smoke_test.sh
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != "success" ]; then
        echo "Smoke tests failed; triggering instant rollback."
        bash scripts/ci/rollback_bluegreen.sh || bash scripts/ci/rollback_production.sh || true
      fi
  extends:
    - .deploy_rules
  needs:
    - deploy:production

# Docker cleanup on nightly deploy pipelines.
# Removes only unused artifacts older than 7 days to protect rollback-near images.
maintenance:docker-cleanup:
  stage: smoke
  tags:
    - shell
  script:
    - echo "=== Disk usage (before cleanup) ==="
    - df -h /var || true
    - docker system df || true
    - echo "Pruning unused images older than 7 days..."
    - docker image prune -af --filter "until=168h" || true
    - echo "Pruning build cache older than 48 hours..."
    - docker builder prune -af --filter "until=48h" || true
    - echo "Rotating backups (keep newest 5)..."
    - cd /var/llars/backups && ls -t *.sql 2>/dev/null | tail -n +6 | xargs -r rm -f || true
    - echo "=== Disk usage (after cleanup) ==="
    - df -h /var || true
    - docker system df || true
    - |
      AVAIL=$(df /var --output=avail | tail -1 | tr -d ' ')
      if [ "$AVAIL" -lt 10485760 ]; then
        echo "WARNING: /var has less than 10GB free ($((AVAIL/1024/1024))GB). Running emergency cleanup..."
        docker image prune -af --filter "until=24h" || true
        docker builder prune -af || true
      fi
  extends:
    - .deploy_rules
  needs:
    - job: smoke:production
      optional: true
  when: on_success
  allow_failure: true

# =============================================================================
# STAGE 9: ROLLBACK
# =============================================================================

rollback:production:
  stage: rollback
  tags:
    - shell
  environment:
    name: production
  resource_group: production
  script:
    - echo "=== EMERGENCY ROLLBACK ==="
    - bash scripts/ci/rollback_bluegreen.sh || bash scripts/ci/rollback_production.sh
  rules:
    - *test_only_skip
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DEPLOY == "true"
      when: manual
    - if: $FORCE_DEPLOY == "true" && $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: true

# =============================================================================
# CODE METRICS COLLECTION
# =============================================================================

metrics:collect:
  stage: test
  image: node:20-alpine
  before_script:
    - apk add --no-cache python3
  script:
    - echo "Collecting Code Quality Metrics..."
    - python3 scripts/metrics/collect_python_metrics.py --json > python_metrics.json
    - node scripts/metrics/collect_frontend_metrics.js --json > frontend_metrics.json
    - echo ""
    - echo "=== PYTHON METRICS ==="
    - python3 -c "import json; m=json.load(open('python_metrics.json')); s=m['summary']; print('Function Coverage:', str(s['function_coverage'])+'%'); print('Class Coverage:', str(s['class_coverage'])+'%')"
    - echo ""
    - echo "=== FRONTEND METRICS ==="
    - node -e "const m=require('./frontend_metrics.json'); console.log('JSDoc Coverage:', m.summary.coverage+'%')"
  artifacts:
    paths:
      - python_metrics.json
      - frontend_metrics.json
    reports:
      metrics:
        - python_metrics.json
        - frontend_metrics.json
    expire_in: 30 days
  extends:
    - .ci_rules
  allow_failure: true

metrics:update-docs:
  stage: smoke
  tags:
    - shell
  script:
    - echo "Updating documentation with metrics..."
    - cd /var/llars
    - python3 scripts/metrics/collect_python_metrics.py
    - node scripts/metrics/collect_frontend_metrics.js
    - python3 scripts/metrics/update_docs.py
    - echo "Metrics documentation updated"
  extends:
    - .deploy_rules
  needs:
    - metrics:collect
    - job: smoke:production
      optional: true
  when: on_success
  allow_failure: true
