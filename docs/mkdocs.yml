site_name: LLARS Dokumentation
site_description: Dokumentation für das LLARS (LLM Assisted Research System)
site_author: LLARS Team
# Die Doku wird unter dem Unterpfad /mkdocs/ ausgeliefert. Ohne site_url erzeugt
# das mkdocs-static-i18n-Plugin die Sprachwechsel-Links root-relativ (z.B. "/"
# bzw. "/en/") und wirft den Nutzer aus der Doku auf die App-Landingpage. Mit
# dem korrekten Basispfad bekommen die alternate-/hreflang-Links den
# /mkdocs/-Präfix. WICHTIG: Dev-nginx darf den /mkdocs/-Präfix dann NICHT mehr
# strippen (proxy_pass ohne Trailing-Slash), da `mkdocs serve` mit gesetztem
# site_url-Pfad die Seite unter /mkdocs/ ausliefert.
site_url: https://llars.e-beratungsinstitut.de/mkdocs/
dev_addr: 0.0.0.0:8000
use_directory_urls: true

theme:
  name: material
  # LLARS-Logo im Header + als Favicon (aus dem Frontend übernommen).
  logo: assets/llars-logo.png
  favicon: assets/llars-logo.png
  # LLARS-Farben werden per extra_css (stylesheets/llars.css) über die
  # Material-CSS-Variablen gesetzt; die Palette liefert nur den Light/Dark-
  # Umschalter (primary/accent bleiben unbenannt, damit das CSS gewinnt).
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

extra_css:
  - stylesheets/llars.css

