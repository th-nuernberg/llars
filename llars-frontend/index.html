<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <!-- Favicons + app icons. Transparent background (design decision): the mark
       sits directly on the host UI (e.g. Safari iOS shows it inside its own
       light tab chip without an extra coloured box). The icons are regenerated
       from the 512px master with the transparent padding TRIMMED so the mark
       fills the frame — the original transparent favicon read as a faint smudge
       at 16/32 px only because the mark was tiny inside a large empty square.
       Note: a transparent apple-touch icon is backed black on the iOS home
       screen ("Add to Home Screen"); acceptable here as the app is used in the
       browser, not installed. ?v= busts the browser/OS favicon cache. -->
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=4" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Mobile viewport settings -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
  <!-- iOS Safari specific -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="LLARS" />
  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#b0ca97" />
  <!-- Disable telephone number detection on iOS -->
  <meta name="format-detection" content="telephone=no" />

  <!-- ============================================================
       SEO / Social — statische Basis (Standardsprache Deutsch). Das ist,
       was Crawler VOR dem JS-Rendering sehen; einzelne Routen aktualisieren
       Titel/Description zur Laufzeit (src/router.js, DEFAULT_TITLE + Route-Meta).
       Bei Textänderungen hier UND dort nachziehen.
       Acronym in plain caps: der Small-Caps-Schriftzug ist HTML/CSS-only,
       ein Tab-Titel kann kein Small-Caps — daher "LLARS".
       ============================================================ -->
  <title>LLARS – Quelloffene Plattform für LLM-Evaluation & Labeling</title>
  <meta name="description" content="LLARS ist eine quelloffene, für Forschung kostenlose Plattform zur kollaborativen Evaluation und zum Labeling von LLM-Ausgaben: menschliche Bewertungen, LLM-Assessoren und Inter-Rater-Reliabilität (Krippendorff's Alpha). Für Forschungsteams." />
  <meta name="keywords" content="LLM-Evaluation, LLM evaluation software, Labeling-Software, label software, Annotation, Inter-Rater-Reliabilität, Krippendorff's Alpha, LLM-as-a-judge, Prompt Engineering, RAG, quelloffen, source-available, Forschungsplattform, LLARS" />

<body>
  <div id="app"></div>
  <!--
    Crawler-/No-JS-Fallback: echter Textinhalt für Suchmaschinen und
    Nutzer ohne JavaScript. Wird ignoriert, sobald die SPA in #app mountet.
    Ersetzt kein SSR-Prerendering, liefert aber den wichtigsten Inhalt
    risikofrei. Bei Landing-Textänderungen hier grob nachziehen.
  -->
  <noscript>
    <main style="max-width:820px;margin:0 auto;padding:32px 24px;font-family:system-ui,Arial,sans-serif;line-height:1.6;color:#2c3e2d;">
      <h1>LLARS – Quelloffene Plattform für LLM-Evaluation &amp; Labeling</h1>
      <p>
        LLARS (LLM Assisted Research System) ist eine quelloffene, für
        Forschung kostenlose Plattform (PolyForm Noncommercial 1.0.0) zur
        kollaborativen Evaluation und zum Labeling
        von LLM-Ausgaben. Sie verbindet menschliche Bewertungen mit
        LLM-Assessoren und misst die Inter-Rater-Reliabilität (u. a. ordinales
        Krippendorff's Alpha). Entwickelt für Forschungsteams.
      </p>
      <h2>Funktionen</h2>
      <ul>
        <li>Sieben Evaluationstypen: Rating, Ranking, Vergleich, Labeling, Authentizität, Mail-Rating, Kommunikationsvergleich</li>
        <li>Labeling Co-Pilot: LLM-Vorschläge mit Begründung und Textbeleg – klar gekennzeichnet, nie vorausgewählt</li>
        <li>Kollaboratives Prompt Engineering und Batch-Generierung</li>
        <li>RAG-Pipeline (ChromaDB), LLM-Evaluatoren, Übereinstimmungs-Metriken</li>
        <li>Self-Hosting per Docker, Authentik-SSO, rollenbasierte Rechte</li>
      </ul>
      <p>
        <a href="/register">Konto erstellen</a> ·
        <a href="/mkdocs/">Dokumentation</a> ·
        <a href="https://github.com/th-nuernberg/llars">Quellcode auf GitHub</a>
      </p>
      <p><strong>Hinweis:</strong> Für die interaktive Nutzung von LLARS wird JavaScript benötigt.</p>
    </main>
  </noscript>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
